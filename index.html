<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>Urban Rider 3D</title>
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #87ceeb;
      font-family: Arial, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    /* HUD */
    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      right: 15px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      color: white;
      z-index: 10;
      text-shadow: 2px 2px 4px #000;
    }

    .panel {
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 12px;
      padding: 10px 14px;
      backdrop-filter: blur(5px);
    }

    #speed {
      font-size: 25px;
      font-weight: bold;
    }

    #gear {
      font-size: 14px;
      margin-top: 3px;
      opacity: .9;
    }

    #coins {
      font-size: 18px;
      font-weight: bold;
    }

    /* Message */
    #message {
      position: fixed;
      top: 90px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      background: rgba(0,0,0,.45);
      padding: 9px 18px;
      border-radius: 20px;
      font-weight: bold;
      opacity: 0;
      transition: opacity .25s;
      z-index: 20;
      pointer-events: none;
    }

    /* Mobile controls */
    #controls {
      position: fixed;
      inset: auto 0 0 0;
      height: 190px;
      z-index: 30;
      pointer-events: none;
    }

    .control {
      position: absolute;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.35);
      background: rgba(0,0,0,.38);
      color: white;
      font-size: 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      pointer-events: auto;
      backdrop-filter: blur(4px);
    }

    .control:active {
      background: rgba(255,255,255,.3);
      transform: scale(.94);
    }

    #left {
      left: 20px;
      bottom: 75px;
    }

    #right {
      left: 105px;
      bottom: 75px;
    }

    #brake {
      right: 110px;
      bottom: 75px;
      font-size: 19px;
    }

    #gas {
      right: 20px;
      bottom: 75px;
      background: rgba(0,130,255,.48);
    }

    #wheelie {
      right: 20px;
      bottom: 160px;
      width: 58px;
      height: 58px;
      font-size: 20px;
      background: rgba(255,120,0,.48);
    }

    #cameraBtn {
      right: 100px;
      bottom: 160px;
      width: 58px;
      height: 58px;
      font-size: 20px;
    }

    #soundBtn {
      right: 170px;
      bottom: 160px;
      width: 58px;
      height: 58px;
      font-size: 20px;
      background: rgba(30,180,90,.48);
    }

    /* Keep the same control/HUD size on mobile as on desktop. */
    @media (max-width: 520px) {
      #controls { height: 190px; }
      .control {
        width: 72px;
        height: 72px;
        font-size: 28px;
      }
      #left { left: 20px; bottom: 75px; }
      #right { left: 105px; bottom: 75px; }
      #brake { right: 110px; bottom: 75px; width: 72px; font-size: 19px; }
      #gas { right: 20px; bottom: 75px; }
      #wheelie, #cameraBtn, #soundBtn {
        width: 58px;
        height: 58px;
        bottom: 160px;
        font-size: 20px;
      }
      #wheelie { right: 20px; }
      #cameraBtn { right: 100px; }
      #soundBtn { right: 170px; }
      #hud { top: 15px; left: 15px; right: 15px; }
      .panel { padding: 10px 14px; border-radius: 12px; }
      #speed { font-size: 25px; }
      #gear { font-size: 14px; }
      #coins { font-size: 18px; }
      #help { display: block; }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      #controls { height: 190px; }
      #left, #right, #brake, #gas { bottom: 75px; }
      #wheelie, #cameraBtn, #soundBtn { bottom: 160px; }
    }

    @media (min-width: 800px) {
      #controls {
        opacity: .55;
      }
    }

    #help {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,.85);
      background: rgba(0,0,0,.35);
      border-radius: 15px;
      padding: 6px 12px;
      font-size: 12px;
      z-index: 15;
      pointer-events: none;
    }
  </style>
</head>

<body>

<div id="game"></div>

<div id="hud">
  <div class="panel">
    <div id="speed">0 km/h</div>
    <div id="gear">GEAR N</div>
  </div>

  <div class="panel">
    <div id="coins">🪙 0000</div>
  </div>
</div>

<div id="message">WHEELIE!</div>

<div id="controls">
  <div class="control" id="left">◀</div>
  <div class="control" id="right">▶</div>
  <div class="control" id="brake">BRAKE</div>
  <div class="control" id="gas">▲</div>
  <div class="control" id="wheelie">WHEELIE</div>
  <div class="control" id="cameraBtn">📷</div>
  <div class="control soundBtn" id="soundBtn">🔊</div>
</div>

<div id="help">
  W/↑ Accelerate &nbsp; • &nbsp; S/↓ Brake &nbsp; • &nbsp; A/D Steer &nbsp; • &nbsp; Space Wheelie &nbsp; • &nbsp; C Camera &nbsp; • &nbsp; 🔊 Sound
</div>

let buildingPhotoNumber = 0;

function createBuilding(x, z) {

  const width = THREE.MathUtils.randFloat(5, 11);
  const height = THREE.MathUtils.randFloat(5, 22);
  const depth = THREE.MathUtils.randFloat(5, 10);

  const colors = [
    0xe4d7c6,
    0xc7d6df,
    0xd4b59b,
    0xbfc6b8,
    0xf0c66e,
    0xb7b1c9
  ];

  const baseMat = new THREE.MeshStandardMaterial({
    color: colors[
      Math.floor(Math.random() * colors.length)
    ],
    roughness: .85
  });
  const roofMat = baseMat;
  const chosenPhotoTex = (buildingPhotoNumber++ % 2 === 0) ? buildingPhotoTex1 : buildingPhotoTex2;
  const photoMat = new THREE.MeshStandardMaterial({
    map: chosenPhotoTex,
    roughness: .9,
    side: THREE.DoubleSide
  });

  // Put the supplied photo across the entire vertical exterior of every building.
  // Keep the roof/underside in the original building color.
  const building = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    [photoMat, photoMat, roofMat, roofMat, photoMat, photoMat]
  );

  building.position.set(
    x,
    height / 2,
    z
  );

  building.castShadow = true;
  building.receiveShadow = true;

  scene.add(building);

  // Shahnawaz 46 sign on EVERY building, facing the road/player
  const buildingSign = new THREE.Mesh(
    new THREE.PlaneGeometry(Math.min(width * .78, 6.8), 1.25),
    new THREE.MeshBasicMaterial({ map: buildingLabelTex, transparent: true, side: THREE.DoubleSide })
  );
  buildingSign.position.set(0, Math.min(height - .9, Math.max(2.8, height * .62)), depth / 2 + .04);
  building.add(buildingSign);
  addBuildingPhoto(building, width, height, depth);


  /* Windows */

  const windowMat = new THREE.MeshBasicMaterial({
    color: 0x8fd3ff
  });

  for (
    let y = 2;
    y < height - 1;
    y += 2.6
  ) {

    for (
      let wx = -width / 2 + 1;
      wx < width / 2 - .5;
      wx += 2
    ) {

      const win = new THREE.Mesh(
        new THREE.BoxGeometry(.7, .8, .06),
        windowMat
      );

      win.position.set(
        x + wx,
        y,
        z - depth / 2 - .035
      );

      scene.add(win);
    }
  }
}

/* =========================================================
   BIKE PHYSICS
========================================================= */

let speed = 0;

let steering = 0;

let wheelie = false;

let wheelieAmount = 0;

const MAX_SPEED = 48;

const ACCELERATION = 25;

const BRAKE_POWER = 35;

const FRICTION = 7;

let cameraMode = 0;


/* =========================================================
   SIMPLE GAME SOUND (Web Audio)
========================================================= */
let audioCtx = null;
let engineOsc = null;
let engineGain = null;
let soundEnabled = true;

function initAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
  engineOsc = audioCtx.createOscillator();
  engineGain = audioCtx.createGain();
  engineOsc.type = 'sawtooth';
  engineOsc.frequency.value = 70;
  engineGain.gain.value = 0.0001;
  engineOsc.connect(engineGain);
  engineGain.connect(audioCtx.destination);
  engineOsc.start();
}

function updateEngineSound() {
  if (!audioCtx || !engineOsc || !engineGain) return;
  const t = audioCtx.currentTime;
  const targetFreq = 55 + Math.min(Math.abs(speed) * 7.5, 260);
  const targetGain = soundEnabled ? 0.008 + Math.min(Math.abs(speed) / 48, 1) * 0.045 : 0.0001;
  engineOsc.frequency.setTargetAtTime(targetFreq, t, 0.05);
  engineGain.gain.setTargetAtTime(targetGain, t, 0.06);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundBtn');
  btn.textContent = soundEnabled ? '🔊' : '🔇';
  if (!audioCtx && soundEnabled) initAudio();
  if (audioCtx && engineGain) {
    engineGain.gain.setTargetAtTime(
      soundEnabled ? (0.008 + Math.min(Math.abs(speed) / MAX_SPEED, 1) * 0.045) : 0.0001,
      audioCtx.currentTime,
      0.04
    );
  }
}

document.getElementById('soundBtn').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  initAudio();
  toggleSound();
});

window.addEventListener('pointerdown', () => initAudio(), { once: true });

const traffic = [];

function createCar(x, z, color) {

  const car = new THREE.Group();

  const material =
    new THREE.MeshStandardMaterial({
      color,
      metalness: .2,
      roughness: .5
    });

  const chassis = new THREE.Mesh(
    new THREE.BoxGeometry(
      1.7,
      .45,
      3.3
    ),
    material
  );

  chassis.position.y = .55;

  chassis.castShadow = true;

  car.add(chassis);


  const roof = new THREE.Mesh(
    new THREE.BoxGeometry(
      1.35,
      .45,
      1.55
    ),
    material
  );

  roof.position.set(
    0,
    .9,
    -.1
  );

  car.add(roof);


  const wheelPositions = [
    [-.82, .42, -1.05],
    [.82, .42, -1.05],
    [-.82, .42, 1.05],
    [.82, .42, 1.05]
  ];

  wheelPositions.forEach(p => {

    const w = new THREE.Mesh(
      new THREE.CylinderGeometry(
        .34,
        .34,
        .18,
        12
      ),
      black
    );

    w.rotation.z =
      Math.PI / 2;

    w.position.set(
      p[0],
      p[1],
      p[2]
    );

    car.add(w);
  });


  car.position.set(
    x,
    0,
    z
  );

  scene.add(car);

  traffic.push({
    mesh: car,
    speed: THREE.MathUtils.randFloat(
      12,
      25
    )
  });
}

/* =========================================================
   CAMERA
========================================================= */

const desiredCamera =
  new THREE.Vector3();

const cameraLook =
  new THREE.Vector3();


function updateCamera() {

  if (cameraMode === 0) {

    desiredCamera.set(
      bike.position.x,
      bike.position.y + 4.2,
      bike.position.z + 7.5
    );

    cameraLook.set(
      bike.position.x,
      bike.position.y + 1,
      bike.position.z - 4
    );

  } else {

    desiredCamera.set(
      bike.position.x,
      bike.position.y + 1.9,
      bike.position.z + 3
    );

    cameraLook.set(
      bike.position.x,
      bike.position.y + 1,
      bike.position.z - 5
    );
  }

  camera.position.lerp(
    desiredCamera,
    .08
  );

  camera.lookAt(
    cameraLook
  );
}


/* =========================================================
   GAME UPDATE
========================================================= */

const clock =
  new THREE.Clock();

function update(dt) {

  /* Accelerate */

  if (
    keys.ArrowUp ||
    keys.KeyW
  ) {

    speed +=
      ACCELERATION * dt;

  } else {

    speed -=
      FRICTION * dt;
  }


  /* Brake */

  if (
    keys.ArrowDown ||
    keys.KeyS
  ) {

    speed -=
      BRAKE_POWER * dt;
  }


  speed = THREE.MathUtils.clamp(
    speed,
    0,
    MAX_SPEED
  );


  /* Steering */

  let steerTarget = 0;

  if (
    keys.ArrowLeft ||
    keys.KeyA
  )
    steerTarget = 1;

  if (
    keys.ArrowRight ||
    keys.KeyD
  )
    steerTarget = -1;

  steering = THREE.MathUtils.lerp(
    steering,
    steerTarget,
    7 * dt
  );


  /* Move */

  bike.position.z -=
    speed * dt;


  /* Road boundaries */

  bike.position.x =
    THREE.MathUtils.clamp(
      bike.position.x,
      -5.7,
      5.7
    );


  /* Turn bike */

  bike.rotation.y =
    THREE.MathUtils.lerp(
      bike.rotation.y,
      steering * .3,
      8 * dt
    );


  /* Wheelie */

  if (
    wheelie &&
    speed > 8
  ) {

    wheelieAmount =
      THREE.MathUtils.lerp(
        wheelieAmount,
        .55,
        5 * dt
      );

    showMessage(
      "WHEELIE!"
    );

  } else {

    wheelieAmount =
      THREE.MathUtils.lerp(
        wheelieAmount,
        0,
        5 * dt
      );
  }

  bike.rotation.x =
    wheelieAmount;


  /* Wheel spin */

  const spin =
    speed * dt / .42;

  frontWheel.rotation.x += spin;
  rearWheel.rotation.x += spin;


  /* Traffic */

  traffic.forEach(car => {

    car.mesh.position.z +=
      car.speed * dt;

    if (
      car.mesh.position.z >
      bike.position.z + 80
    ) {

      car.mesh.position.z =
        bike.position.z - 450;
    }


    /* Collision */

    const dx =
      Math.abs(
        car.mesh.position.x -
        bike.position.x
      );

    const dz =
      Math.abs(
        car.mesh.position.z -
        bike.position.z
      );

    if (
      dx < 1.5 &&
      dz < 2
    ) {

      speed *= .25;

      showMessage(
        "CRASH!"
      );
    }
  });


  /* Coins */

  coinGroup.children.forEach(
    coin => {

      coin.rotation.z +=
        3 * dt;

      if (
        !coin.userData.collected
      ) {

        const dx =
          coin.position.x -
          bike.position.x;

        const dz =
          coin.position.z -
          bike.position.z;

        if (
          Math.abs(dx) < 1.2 &&
          Math.abs(dz) < 1.5
        ) {

          coin.userData.collected =
            true;

          coin.visible = false;

          addCoin();
        }
      }


      /* Recycle */

      if (
        coin.position.z >
        bike.position.z + 80
      ) {

        coin.position.z -= 700;

        coin.position.x =
          THREE.MathUtils.randFloat(
            -4,
            4
          );

        coin.userData.collected =
          false;

        coin.visible = true;
      }
    }
  );


  /* HUD */

  const kmh =
    Math.round(speed * 3.6);

  speedUI.textContent =
    kmh + " km/h";


  let gear = "N";

  if (kmh > 0 && kmh < 15)
    gear = "1";

  else if (kmh < 30)
    gear = "2";

  else if (kmh < 45)
    gear = "3";

  else
    gear = "4";

  gearUI.textContent =
    "GEAR " + gear;


  updateCamera();
}


/* =========================================================
   DAY/NIGHT CYCLE
========================================================= */

let worldTime = 0;

function updateSky(dt) {

  worldTime +=
    dt * .006;

  const cycle =
    (Math.sin(worldTime) + 1) / 2;

  const skyColor =
    new THREE.Color();

  skyColor.lerpColors(
    new THREE.Color(0x07152d),
    new THREE.Color(0x87ceeb),
    cycle
  );

  scene.background.copy(
    skyColor
  );

  scene.fog.color.copy(
    skyColor
  );

  sun.intensity =
    .35 + cycle * 2.1;

  hemi.intensity =
    .45 + cycle * 1.6;
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth / innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(innerWidth, innerHeight, false);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
  }
);


/* =========================================================
   GAME LOOP
========================================================= */

function animate() {

  requestAnimationFrame(
    animate
  );

  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );

  update(dt);

  updateSky(dt);
  updateEngineSound();

  renderer.render(
    scene,
    camera
  );
}

animate();
